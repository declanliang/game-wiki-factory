name: Generate and publish game wikis

on:
  workflow_dispatch:
    inputs:
      games_json:
        description: 'JSON array, for example ["My Giant Sandwich", "Guess the character color"]'
        required: true
        type: string
      publish_vercel:
        description: Import each generated repository into Vercel
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  generate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        game: ${{ fromJSON(inputs.games_json) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: template/package-lock.json
      - name: Install factory dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate and verify site
        env:
          TOAPIS_API_KEY: ${{ secrets.TOAPIS_API_KEY }}
          LLM_API_KEY_1: ${{ secrets.TOAPIS_API_KEY }}
          LLM_API_KEY_2: ${{ secrets.TOAPIS_API_KEY_2 }}
          LLM_API_KEY_3: ${{ secrets.TOAPIS_API_KEY_3 }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: python gamewiki.py "${{ matrix.game }}"
      - name: Resolve generated slug
        id: slug
        shell: python
        run: |
          import re, os
          slug = "-".join(re.findall(r"[a-z0-9]+", "${{ matrix.game }}".casefold()))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"value={slug}\n")
      - name: Create GitHub repository and import into Vercel
        env:
          FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_GITHUB_TOKEN }}
          FACTORY_GITHUB_OWNER: ${{ vars.FACTORY_GITHUB_OWNER }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: >-
          python gamewiki.py publish "${{ steps.slug.outputs.value }}"
          ${{ inputs.publish_vercel && '' || '--skip-vercel' }}
      - name: Upload diagnostic state on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ steps.slug.outputs.value || matrix.game }}
          path: ../*/.gamewiki/logs/
          include-hidden-files: true
