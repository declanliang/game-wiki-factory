[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seoscout"
version = "0.1.0"
description = "Keyword research to multi-language SEO articles in one pipeline — search YouTube and Google, collect transcripts and web content, generate MDX articles with an LLM, review for topic relevance, and translate."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "declanliang" },
]
keywords = ["seo", "keyword-research", "content-generation", "youtube", "llm", "mdx", "i18n"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing",
]
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
seoscout = "seoscout.cli:main"

[tool.setuptools.packages.find]
include = ["seoscout*"]
